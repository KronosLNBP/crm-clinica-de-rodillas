<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0E7C66">
    <title>Sin conexión - Clínica de Rodillas</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F3F6F5; color: #1E2B33; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        .logo { width: 72px; height: 72px; border-radius: 20px; background: #0E7C66; color: #fff; font-weight: 800; font-size: 30px; display: grid; place-items: center; margin: 0 auto 24px; }
        h1 { font-size: 24px; margin: 0 0 8px; }
        p { color: #4B5A62; margin: 0 0 24px; line-height: 1.5; }
        button { background: #0E7C66; color: #fff; border: 0; border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 700; }
    </style>
</head>
<body>
    <div>
        <div class="logo">CR</div>
        <h1>No hay conexión a internet</h1>
        <p>La agenda necesita internet para mostrar citas y cobros.<br>Revisa el wifi o los datos y vuelve a intentar.</p>
        <button onclick="location.reload()">Volver a intentar</button>
    </div>
</body>
</html>
