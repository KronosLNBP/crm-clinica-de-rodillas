# Compila el APK de Android (app de prueba) en los servidores de GitHub.
# Descárgalo en: pestaña Actions → "APK Android" → la ejecución más reciente → Artifacts → ClinicaCR-apk
name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK de prueba
        run: gradle -p android assembleDebug --no-daemon
      - name: Huella del certificado (para assetlinks.json más adelante)
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ClinicaCR-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
